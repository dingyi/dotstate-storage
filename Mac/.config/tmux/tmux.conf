bind-key "K" display-popup -E -w 40% "sesh connect \"$(
  sesh list -i | gum filter --limit 1 --no-sort --no-strip-ansi --fuzzy --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""

# session switcher (fuzzy)
bind s display-popup -E -w 40% -h 40% -S "fg=#282828" -b rounded \
    "tmux list-sessions -F '#S' | fzf --reverse --border=none --margin=1 --padding=1 \
    --prompt='  ' --pointer='▌' --no-scrollbar \
    --color=bg:#101010,bg+:#232323,fg:#A0A0A0,fg+:#FFFFFF,hl:#FFC799,hl+:#FFC799,pointer:#FFC799,prompt:#FFC799,info:#5C5C5C \
    | xargs -I{} tmux switch-client -t {}"

# sessionizer (fuzzy find projects, create/switch session)
bind f display-popup -E -w 50% -h 50% -S "fg=#282828" -b rounded "~/.config/tmux/scripts/sessionizer"

# root sessions
bind-key "R" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --query  \"\$(sesh root)\" \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' \
    --preview 'sesh preview {}' \
)\""

# Enable focus events for better terminal integration
set-option -g focus-events on

# Display time for messages (3 seconds)
set-option -g display-time 3000

# Terminal colors (modern settings with true color and undercurl support)
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Action key (prefix)
unbind C-b
set -g prefix C-a
set -g repeat-time 0
bind C-a send-prefix

# Basic settings
set -g base-index 1          # start indexing windows at 1 instead of 0
set -g detach-on-destroy off # don't exit from tmux when closing a session
set -g escape-time 0         # zero-out escape time delay (faster response)
set -g history-limit 100000 # increase history size (from 2,000)
set -g mouse on              # enable mouse support
set -g renumber-windows on   # renumber all windows when any window is closed
set -g set-clipboard on      # use system clipboard

# Allow passthrough for image rendering, etc.
set -g allow-passthrough on

# bindings
bind -N "⌘+9 switch to root session (via sesh) " 9 run-shell "sesh connect --root $(pwd)"
bind -N "⌘+^+t join pane" J join-pane -t 1
bind -N "⌘+a ai" A new-window -S -n 'ai' 'ai'
bind -N "⌘+b builder" b new-window -S -n 'build' 'build'
bind -N "⌘+d dev" D new-window -S -n 'dev' 'dev'
bind -N "⌘+e editor" E new-window -S -n 'nvim' 'nvim +GoToFile'
bind -N "⌘+⇧+G gh-dash " G new-window -c "#{pane_current_path}" -n "ghd" "ghd 2> /dev/null"
bind -N "⌘+g lazygit" g new-window -S -n 'git' 'lazygit'
bind -N "⌘+l last-session (via sesh) " L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"
bind -N "⌘+⇧+Q kill current session" Q kill-session
bind -N "⌘+⇧+R run a script" Y split-window -v -l 10 "npm run (jq -r '.scripts | keys[]' package.json | fzf --no-border)"
bind -N "⌘+⇧+T break pane" B break-pane

bind = split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# window navigation without prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-n next-window
bind -n M-p previous-window

# quick actions
bind x kill-pane
bind X kill-window
bind z resize-pane -Z

# resize panes (prefix + arrow keys)
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# copy mode
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

bind-key "Z" display-popup -E "sesh connect \$(sesh list | zf --height 24)"

# disable bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# status bar
set -g status-position top
set -g status-justify left
set -g status-style "bg=#0a1612 fg=#A0A0A0"
set -g status-interval 1

# status left: session name
set -g status-left "#[fg=#e85d04,bold] #S #[fg=#5C5C5C]│ "
set -g status-left-length 20
set -g status-left-style "bg=#0a1612"

# status right: time
set -g status-right "#[fg=#A0A0A0]%-I:%M %p "
set -g status-right-length 50
set -g status-right-style "bg=#0a1612"

# window format
setw -g window-status-format "#[fg=#5C5C5C] #W "
setw -g window-status-current-format "#[fg=#8fb3a5,bold] #W "
setw -g window-status-separator ""
setw -g window-status-style "bg=#0a1612"
setw -g window-status-current-style "bg=#0a1612"
setw -g window-status-activity-style "bg=#8fb3a5"

# pane borders
set -g pane-border-lines simple
set -g pane-border-style "fg=#282828"
set -g pane-active-border-style "fg=#e85d04"

# message style
set -g message-style "bg=#0a1612 fg=#8fb3a5"
set -g message-command-style "bg=#232323 fg=#8fb3a5"

# mode style (copy mode)
setw -g mode-style "bg=#0a1612 fg=#8fb3a5"

# clock
setw -g clock-mode-colour "#e85d04"

# Vi mode keys
set-window-option -g mode-keys vi

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# Clear automatic-rename-format (remove tmux-nerd-font-window-name plugin format)
set-option -g automatic-rename-format ""
set -g allow-rename off
set-window-option -g automatic-rename off

# Plugins (via TPM)
# ----------------------------------------------------------------------------

set -g @floax-bind H
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @thumbs-command 'echo -n {} | pbcopy' # copy to clipboard
set -g @thumbs-key C
set -g @tmux-last-color on
set -g @tmux-last-pager 'less'
set -g @tmux-last-prompt-pattern ' '
set -g @tnotify-custom-cmd 'bash ~/bin/tmux-notify.sh'

# resurrect - save/restore sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# continuum - auto save/restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

set -g @plugin 'joshmedeski/tmux-overmind'
set -g @plugin 'IdoKendo/tmux-lazy'
set -g @plugin 'joshmedeski/tmux-voice-mode'
set -g @plugin 'fcsonline/tmux-thumbs'          # <cmd|shift>+c
set -g @plugin 'jimeh/tmuxifier'

set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'joshmedeski/vim-tmux-navigator' # <ctrl>+hjkl
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'tmux-plugins/tpm'        # load tpm
run "$HOME/.config/tmux/plugins/tpm/tpm" # run tpm (always end of file)

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/utility.conf
